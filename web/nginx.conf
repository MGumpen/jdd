# Serverer de statiske filene og videresender /api/ til FastAPI.
# Da kjører nettsiden og API-et på samme adresse, og vi slipper CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # KI-svar i chatboten kan ta litt tid
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
